<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060d">
  <title>AoN Role Bot</title>
  <link rel="icon" href="/static/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="l-top">
    <a class="brand" href="/"><img src="/static/brand/mark-64.png" srcset="/static/brand/mark-128.png 2x" width="34" height="34" alt=""><span data-i18n="app_name"></span></a>
    <span class="grow"></span>
    <button class="btn" id="lang-toggle" type="button"></button>
    <a class="btn" id="open-dashboard" href="/app" data-i18n="open_dashboard"></a>
    <a class="btn primary" id="login-btn" href="/auth/login" data-i18n="login"></a>
  </header>
  <main class="l-wrap">
    <div class="callout warn" id="login-error" role="alert" hidden data-i18n="error_generic"></div>
    <section class="hero">
      <img class="hero-logo" src="/static/brand/logo-full-256.webp" srcset="/static/brand/logo-full-512.webp 2x" width="168" height="168" alt="AoN Role Bot">
      <div><span class="badge ok" data-i18n="hero_badge"></span></div>
      <h1 data-i18n="hero_title"></h1>
      <p data-i18n="hero_text"></p>
      <div class="cta">
        <a class="btn primary" id="add-bot" href="/auth/login" data-i18n="add_bot"></a>
        <a class="btn" href="/app" data-i18n="open_dashboard"></a>
      </div>
      <div class="chips"><span class="badge" data-i18n="chip_1"></span><span class="badge" data-i18n="chip_2"></span><span class="badge" data-i18n="chip_3"></span></div>
    </section>
    <section class="section" aria-labelledby="feat-h">
      <h2 id="feat-h" data-i18n="feat_h"></h2><p class="lead" data-i18n="feat_lead"></p>
      <div class="grid">
        <article class="card feature"><span class="ico" data-icon="link"></span><h3 data-i18n="f1_t"></h3><p class="muted" data-i18n="f1_d"></p></article>
        <article class="card feature"><span class="ico" data-icon="roles"></span><h3 data-i18n="f2_t"></h3><p class="muted" data-i18n="f2_d"></p></article>
        <article class="card feature"><span class="ico" data-icon="ranks"></span><h3 data-i18n="f3_t"></h3><p class="muted" data-i18n="f3_d"></p></article>
        <article class="card feature"><span class="ico" data-icon="shield"></span><h3 data-i18n="f4_t"></h3><p class="muted" data-i18n="f4_d"></p></article>
        <article class="card feature"><span class="ico" data-icon="sync"></span><h3 data-i18n="f5_t"></h3><p class="muted" data-i18n="f5_d"></p></article>
        <article class="card feature"><span class="ico" data-icon="card"></span><h3 data-i18n="f6_t"></h3><p class="muted" data-i18n="f6_d"></p></article>
      </div>
    </section>
    <section class="section" aria-labelledby="lt-h">
      <h2 id="lt-h" data-i18n="lt_h"></h2><p class="lead" data-i18n="lt_lead"></p>
      <div class="grid">
        <article class="card feature"><span class="ico" data-icon="flag"></span><h3 data-i18n="lt_country"></h3><p class="muted" data-i18n="lt_country_d"></p></article>
        <article class="card feature"><span class="ico" data-icon="users"></span><h3 data-i18n="lt_party"></h3><p class="muted" data-i18n="lt_party_d"></p></article>
        <article class="card feature"><span class="ico" data-icon="shield"></span><h3 data-i18n="lt_unit"></h3><p class="muted" data-i18n="lt_unit_d"></p></article>
      </div>
    </section>
    <section class="section" aria-labelledby="how-h">
      <h2 id="how-h" data-i18n="how_t"></h2>
      <ol class="steps"><li data-i18n="how_1"></li><li data-i18n="how_2"></li><li data-i18n="how_3"></li><li data-i18n="how_4"></li></ol>
    </section>
    <section class="section" aria-labelledby="safe-h">
      <h2 id="safe-h" data-i18n="safe_h"></h2>
      <div class="card"><ul class="checks">
        <li><span data-icon="check"></span><span data-i18n="safe_1"></span></li><li><span data-icon="check"></span><span data-i18n="safe_2"></span></li>
        <li><span data-icon="check"></span><span data-i18n="safe_3"></span></li><li><span data-icon="check"></span><span data-i18n="safe_4"></span></li>
      </ul></div>
    </section>
    <section class="section" aria-labelledby="faq-h">
      <h2 id="faq-h" data-i18n="faq_h"></h2>
      <div class="faq">
        <details class="card"><summary data-i18n="faq1_q"></summary><p class="muted" data-i18n="faq1_a"></p></details>
        <details class="card"><summary data-i18n="faq2_q"></summary><p class="muted" data-i18n="faq2_a"></p></details>
        <details class="card"><summary data-i18n="faq3_q"></summary><p class="muted" data-i18n="faq3_a"></p></details>
      </div>
    </section>
    <section class="final-cta">
      <h2 data-i18n="cta_h"></h2><p class="muted" data-i18n="cta_lead"></p>
      <div class="cta"><a class="btn primary" id="add-bot-2" href="/auth/login" data-i18n="add_bot"></a><a class="btn" href="/app" data-i18n="open_dashboard"></a></div>
    </section>
  </main>
  <footer class="footer"><span class="credit">Developed by AbuDujana</span><span data-i18n="footer_note"></span></footer>
  <noscript><p class="l-wrap">JavaScript is required.</p></noscript>
  <script src="/static/i18n.js"></script><script src="/static/common.js"></script><script src="/static/landing.js"></script>
</body>
</html>
