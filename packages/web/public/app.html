<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AoN Role Bot</title>
  <link rel="icon" href="/static/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>

    <a class="brand" href="/app"><img src="/static/brand/mark-64.png" srcset="/static/brand/mark-128.png 2x" width="34" height="34" alt=""><span data-i18n="app_name"></span></a>

    <button class="btn" id="logout" type="button" data-i18n="logout" hidden></button>

  <script src="/static/i18n.js"></script><script src="/static/common.js"></script><script src="/static/app.js"></script>
