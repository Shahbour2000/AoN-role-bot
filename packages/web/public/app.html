<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060d">
  <title>AoN Role Bot</title>
  <link rel="icon" href="/static/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip" href="#root" data-i18n="skip_to_content"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar" data-i18n-aria="nav_aria">
      <a class="brand" href="/app"><img src="/static/brand/mark-64.png" srcset="/static/brand/mark-128.png 2x" width="36" height="36" alt=""><span data-i18n="app_name"></span></a>
      <div class="switcher" id="switcher" hidden></div>
      <nav class="nav" id="nav" data-i18n-aria="nav_aria"></nav>
      <div class="sidebar-foot credit">Developed by AbuDujana</div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-col">
      <header class="topbar">
        <button class="btn icon-only menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" data-icon="menu" data-i18n-aria="menu_open"></button>
        <span class="grow"></span>
        <span class="who" id="who"></span>
        <button class="btn" id="lang-toggle" type="button"></button>
        <button class="btn" id="logout" type="button" data-icon="logout" hidden><span data-i18n="logout"></span></button>
      </header>
      <main class="content" id="root" aria-live="polite"></main>
      <footer class="footer"><span class="credit">Developed by AbuDujana</span><span data-i18n="footer_note"></span></footer>
    </div>
  </div>
  <noscript><p class="content">JavaScript is required.</p></noscript>
  <script src="/static/i18n.js"></script><script src="/static/common.js"></script><script src="/static/picker.js"></script><script src="/static/app.js"></script>
</body>
</html>
